name: Shopify Risk Monitor Automated Task

on:
  schedule:
    # 每 10 分钟自动运行一次（采用 UTC 时间 Cron 表达式）
    - cron: '12 * * * *'
  workflow_dispatch: # 支持手动点击按钮触发运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Create stores.json from Secret
      run: |
        echo '${{ secrets.STORES_JSON }}' > stores.json

    - name: Run Shopify Risk Monitor Script
      run: |
        python main.py
