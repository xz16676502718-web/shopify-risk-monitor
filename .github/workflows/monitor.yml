name: Shopify Risk Monitor Automated Task

on:
  schedule:
    - cron: '6/10 * * * *'  # 每小时的 6, 16, 26, 36, 46, 56 分自动触发
  workflow_dispatch:        # 支持在 GitHub 界面或 API 手动触发
  repository_dispatch:      # 支持外部 Webhook (如 cron-job.org) 触发
    types: [cron_trigger]

jobs:
  run-inspection:
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 从 Secret 生成 stores.json
        env:
          STORES_JSON_DATA: ${{ secrets.STORES_JSON }}
        run: |
          echo "$STORES_JSON_DATA" > stores.json

      - name: 执行多店铺风控巡检
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          STORES_JSON: ${{ secrets.STORES_JSON }}
        run: |
          python main.py
